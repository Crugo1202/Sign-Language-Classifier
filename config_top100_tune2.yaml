seed: 42
device: "cuda"
num_classes: 100

data:
  root: "data/skeletons"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  t_max: 64
  num_workers: 4

train:
  epochs: 300
  patience: 50
  batch_size: 16
  learning_rate: 0.00018
  weight_decay: 0.0015
  warmup_epochs: 5
  label_smoothing: 0.18
  alpha_geo: 0.1
  beta_sym: 0.05
  grad_clip: 1.0
  save_dir: "checkpoints"
  save_name: "top100_tune2_best.pt"

preprocess:
  rotation_deg: 18.0
  scale_range: [0.85, 1.15]
  noise_std: 0.015
  temporal_stretch: [0.78, 1.22]
  mirror_prob: 0.45
  align_hands_to_palm: true

model:
  tssn:
    k: 8
    temporal_kernel: 9
    hidden_size: 32
    lstm_layers: 1
    attn_heads: 2
    output_dim: 64
  ftde:
    conv_channels: 16
    conv_kernel: 7
    hidden_size: 32
    lstm_layers: 1
    alpha_finsler: 1.5
    temperature_tau: 0.5
  nmn:
    grouped_channels: 16
    temporal_channels: 32
    temporal_kernel: 5
    hidden_size: 32
  orientation:
    hidden_dim: 16
  fusion:
    hand_heads: 2
    modal_heads: 2
    shared_dim: 64
    final_dim: 64
    dropout: 0.5
    modality_dropout: 0.3
