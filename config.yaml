seed: 42
device: "cuda"
num_classes: 100

data:
  root: "data/skeletons"
  train_split: "train"
  val_split: "val"
  test_split: "test"
  t_max: 64
  num_workers: 4

train:
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  label_smoothing: 0.1
  alpha_geo: 0.1
  beta_sym: 0.05
  grad_clip: 1.0
  save_dir: "checkpoints"
  save_name: "dslnet_upgraded_best.pt"

model:
  tssn:
    k: 8
    temporal_kernel: 9
    hidden_size: 256
    lstm_layers: 2
    attn_heads: 8
    output_dim: 512
  ftde:
    conv_channels: 64
    conv_kernel: 7
    hidden_size: 256
    lstm_layers: 2
    alpha_finsler: 1.5
    temperature_tau: 0.5
  nmn:
    grouped_channels: 16
    temporal_channels: 128
    temporal_kernel: 5
    hidden_size: 128
  fusion:
    hand_heads: 8
    modal_heads: 8
    shared_dim: 512
    final_dim: 512

augment:
  enabled: true
  rotation_range: 15.0
  scale_range: [0.9, 1.1]
  noise_std: 0.01
  temporal_stretch: [0.8, 1.2]
  mirror_prob: 0.3
